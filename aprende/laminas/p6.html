<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>Aprende 6: los dos sentidos de derechos</title>
<link rel="stylesheet" href="lamina.css">
<style>
  /* Recurso: una entrada de diccionario. La palabra tiene dos acepciones;
     la segunda se abre en ejemplos y al final las flechas se invierten
     respecto de las obligaciones. */
  #voz { position: absolute; left: 56px; top: 196px; width: 580px; }
  #voz .w { font-family: Serif4, serif; font-weight: 600; font-size: 58px; letter-spacing: -1px; line-height: 1; }
  #voz .g { margin-left: 14px; font-size: 16px; font-weight: 500; color: var(--ink3); }
  .acep { position: absolute; left: 56px; width: 580px; font-family: Serif4, serif; font-size: 22px; line-height: 1.45; padding-left: 36px; }
  .acep .num { position: absolute; left: 0; top: 0; font-family: Serif4, serif; font-weight: 600; color: var(--teal); }
  .acep .art { display: block; margin-top: 6px; font-size: 14px; }
  #a1 { top: 284px; } #a2 { top: 416px; }
  #a2 .txt { background-image: linear-gradient(var(--teal-l), var(--teal-l)); background-repeat: no-repeat;
    background-position: 0 92%; background-size: calc(var(--p, 0) * 100%) 42%; }
  #lista { position: absolute; left: 700px; top: 200px; width: 524px; }
  .der { display: grid; grid-template-columns: 64px 1fr; column-gap: 12px; padding: 12px 0; border-top: 1.5px solid var(--line); }
  .der .fr { font-family: Mono, monospace; font-weight: 600; font-size: 14px; color: var(--teal); padding-top: 4px; white-space: nowrap; }
  .der .t { font-size: 18.5px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.3; }
  .der .s { grid-column: 2; margin-top: 2px; font-size: 15px; color: var(--ink2); }
  #pro { margin-top: 6px; padding-top: 12px; border-top: 1.5px solid var(--line); font-size: 15px; color: var(--ink2); line-height: 1.4; }
  #pro b { color: var(--ink); font-weight: 600; }
  .dir { position: absolute; top: 578px; width: 544px; height: 80px; }
  #dirA { left: 56px; } #dirB { left: 680px; }
  .dir .p { position: absolute; top: 0; padding: 8px 15px; border-radius: 999px; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .dir .yo { left: 0; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
  .dir .sat { right: 0; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
  .dir .rot { position: absolute; top: 50px; left: 0; width: 100%; text-align: center; font-size: 16px; font-weight: 600; }
  #dirA .rot { color: var(--ink2); } #dirB .rot { color: var(--teal); }
  svg.wires path.oblig { stroke: var(--ink3); stroke-width: 2; }
  .m #voz { left: 32px; top: 196px; width: 656px; }
  .m #voz .w { font-size: 50px; }
  .m .acep { left: 32px; width: 656px; font-size: 20px; padding-left: 30px; }
  .m #a1 { top: 268px; } .m #a2 { top: 378px; }
  .m #lista { left: 32px; top: 474px; width: 656px; }
  .m .der { grid-template-columns: 64px 1fr; padding: 7px 0; }
  .m .der .t { font-size: 16.5px; }
  .m .der .s { display: none; }
  .m #pro { font-size: 14px; padding-top: 8px; }
  .m .dir { width: 656px; height: 70px; }
  .m #dirA { left: 32px; top: 752px; } .m #dirB { left: 32px; top: 824px; }
  .m .dir .rot { top: 0; font-size: 14px; }
  .m .dir .p { top: 24px; font-size: 15px; padding: 6px 13px; }
</style>
</head><body><div id="stage">

  <div class="fig">

    <div id="voz"><span class="w" lang="es">derechos</span><span class="g" data-t="gloss"></span></div>
    <div class="acep" id="a1" data-baja="p2"><span class="num">1.</span><span data-t="a1"></span><span class="art" data-t="a1r"></span></div>
    <div class="acep" id="a2"><span class="num">2.</span><span class="txt" data-t="a2"></span><span class="art" data-t="a2r"></span></div>
    <div id="lista">

      <div id="pro" data-t="pro"></div>

    <svg class="wires" viewBox="0 0 1280 720" aria-hidden="true">
      <defs>
        <marker id="pg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#78716C" stroke-width="1.6"/></marker>
        <marker id="pt" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#0F766E" stroke-width="1.6"/></marker>

  </div>

    <div class="tit" data-t="endH"></div>

  </div>
</div>
<script src="const.js"></script>
<script src="motor.js"></script>
<script>

    yo: 'Usted', rotA: 'Obligaciones', rotB: 'Derechos del contribuyente',

    legal: K.LEGAL_ES, verif: K.VERIF_ES,
  },
  en: {
    kicker: 'Learn · 6 of 6',
    c1: 'In Mexican tax law, the word <em>derechos</em> has two meanings.',
    c2: 'The first is a contribution. You pay it when the State provides you a service, such as a passport.',

fill(T);

// Flechas entre Tú y SAT, medidas sobre las fichas ya pintadas.
function flecha(dirId, wId, haciaSat) {
  const dir = document.getElementById(dirId), fig = document.querySelector('.fig').getBoundingClientRect();
  const tu = dir.querySelector('.yo').getBoundingClientRect(), sat = dir.querySelector('.sat').getBoundingClientRect();
  const y = tu.top + tu.height / 2 - fig.top, x0 = tu.right - fig.left + 10, x1 = sat.left - fig.left - 10;
  document.getElementById(wId).setAttribute('d', haciaSat ? `M ${x0} ${y} L ${x1 - 3} ${y}` : `M ${x1} ${y} L ${x0 + 3} ${y}`);
}

document.fonts.ready.then(() => {
  flecha('dirA', 'wA', true); flecha('dirB', 'wB', false);

  enter('.brand', 0.1, 0.6); enter('.kicker', 0.2, 0.6);
  enter('#c1', 0.3, 0.7);
  enter('#voz', 0.7, 0.8, 10);
  leave('#c1', 3.6, 0.3); enter('#c2', 3.9, 0.6); enter('#a1', 4.2, 0.7, 10);
  leave('#c2', 8.6, 0.3); enter('#c3', 8.9, 0.6); enter('#a2', 9.2, 0.7, 10); sweep('#a2 .txt', 9.9, 1.2);
  leave('#c3', 12.8, 0.3); enter('#c4', 13.1, 0.6);
  enter('#d1', 13.5, 0.5, 8); enter('#d2', 14.1, 0.5, 8); enter('#d3', 14.7, 0.5, 8); enter('#d4', 15.3, 0.5, 8); enter('#pro', 16.0, 0.6, 6);
  leave('#c4', 18.6, 0.3); enter('#c5', 18.9, 0.6);
  enter('#dirA', 19.2, 0.5, 6); draw('#wA', 19.6, 0.7);
  enter('#dirB', 20.4, 0.5, 6); draw('#wB', 20.8, 0.7);
  terminar(24.5);
});
</script>
</body></html>
